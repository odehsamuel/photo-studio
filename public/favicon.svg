<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#luminaGrad)" stroke-width="2.5" />

  <!-- Ambient light glow circle behind lens -->
  <circle cx="32" cy="35" r="14" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- Camera Body -->
  <path
    d="M38 16h-12l-3.5 5H13a5 5 0 0 0-5 5v20a5 5 0 0 0 5 5h38a5 5 0 0 0 5-5V26a5 5 0 0 0-5-5h-9.5L38 16z"
    fill="none"
    stroke="url(#luminaGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Camera Outer Lens -->
  <circle
    cx="32"
    cy="36"
    r="8"
    fill="none"
    stroke="url(#luminaGrad)"
    stroke-width="3"
  />

  <!-- Camera Inner Aperture Pupil -->
  <circle
    cx="32"
    cy="36"
    r="3.5"
    fill="url(#luminaGrad)"
  />

  <!-- Lens reflection glare dot -->
  <circle cx="34.5" cy="33.5" r="1.2" fill="#ffffff" />

  <!-- Camera Viewfinder / Sensor flash indicator -->
  <circle cx="45" cy="27" r="2" fill="#34d399" />
</svg>
